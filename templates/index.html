<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenFlix</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body class="bg-background text-text-primary">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 w-60 h-full bg-surface-dark p-4">
        <h1 class="text-2xl font-bold text-accent mb-8">SenFlix</h1>
        <nav>
            <ul>
                <li class="py-2 hover:text-accent cursor-pointer transition-colors">Home</li>
                <li class="py-2 hover:text-accent cursor-pointer transition-colors">Movies</li>
                <li class="py-2 hover:text-accent cursor-pointer transition-colors">TV Shows</li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="ml-60">
        {% for category in categories %}
        <section class="mb-12">
            <!-- Hero Section -->
            <div class="relative h-35vh overflow-hidden">
                <div class="absolute inset-0">
                    <img src="{{ category.hero_image }}" 
                         alt="{{ category.name }}" 
                         class="w-full h-full object-cover hero-image">
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-background"></div>
                </div>
                <div class="relative h-full flex items-end">
                    <h2 class="text-4xl font-bold p-8">{{ category.name }}</h2>
                </div>
            </div>

            <!-- Movie Carousel -->
            <div class="relative movie-carousel-container px-8 py-4">
                <div class="movie-carousel flex space-x-4 overflow-x-auto min-h-carousel">
                    {% for movie in category.movies %}
                    <div class="flex-none w-64">
                        <div class="bg-surface-dark rounded-lg p-4 h-full hover:bg-surface-light transition-colors duration-300">
                            <h3 class="text-lg font-bold mb-2">{{ movie.title }}</h3>
                            <p class="text-sm text-text-secondary">{{ movie.description }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                
                <!-- Carousel Navigation -->
                <button class="carousel-button absolute left-0 top-1/2 transform -translate-y-1/2 bg-background/80 p-2 rounded-r">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button class="carousel-button absolute right-0 top-1/2 transform -translate-y-1/2 bg-background/80 p-2 rounded-l">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </section>
        {% endfor %}
    </main>

    <script>
        // Smooth scroll for hero images
        document.addEventListener('scroll', () => {
            const heroes = document.querySelectorAll('.hero-image');
            heroes.forEach(hero => {
                const section = hero.closest('section');
                const rect = section.getBoundingClientRect();
                const scrollProgress = rect.top / window.innerHeight;
                const offset = Math.min(100, Math.max(-100, scrollProgress * 30));
                hero.style.setProperty('--scroll-offset', `${offset}px`);
            });
        });

        // Carousel Navigation
        document.querySelectorAll('.movie-carousel-container').forEach(container => {
            const carousel = container.querySelector('.movie-carousel');
            const prevBtn = container.querySelector('button:first-of-type');
            const nextBtn = container.querySelector('button:last-of-type');
            
            prevBtn.addEventListener('click', () => {
                carousel.scrollBy({ left: -300, behavior: 'smooth' });
            });
            
            nextBtn.addEventListener('click', () => {
                carousel.scrollBy({ left: 300, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
