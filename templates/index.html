<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenFlix</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body class="bg-background text-text-primary">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 w-60 h-full bg-surface-dark p-4 z-50">
        <h1 class="text-2xl font-bold text-accent mb-8">SenFlix</h1>
        <nav>
            <ul id="category-nav">
                {% for category in categories %}
                <li>
                    <a href="#category-{{ category.id }}" 
                       class="block py-2 hover:text-accent cursor-pointer transition-colors">
                        {{ category.name }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="ml-60 snap-y snap-mandatory h-screen overflow-y-auto" id="main-content">
        {% for category in categories %}
        <section id="category-{{ category.id }}" class="mb-12 snap-start h-screen">
            <!-- Hero Section -->
            <div class="relative h-35vh overflow-hidden">
                <div class="absolute inset-0 will-change-transform">
                    <img src="{{ category.img }}" 
                         alt="{{ category.name }}" 
                         class="w-full h-full object-cover hero-image transform">
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-background"></div>
                </div>
                <div class="relative h-full flex items-end">
                    <h2 class="text-4xl font-bold p-8">{{ category.name }}</h2>
                </div>
            </div>

            <!-- Movie Carousel -->
            <div class="relative movie-carousel-container px-8 py-4">
                <div class="movie-carousel flex space-x-4 overflow-x-auto min-h-carousel">
                    {% for movie in category.movies %}
                    <div class="flex-none w-64">
                        <div class="movie-card">
                            <h3>{{ movie.title }}</h3>
                            <p>{{ movie.description }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                
                <!-- Carousel Navigation -->
                <button class="carousel-button absolute left-0 top-1/2 transform -translate-y-1/2 bg-background/80 p-2 rounded-r">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <button class="carousel-button absolute right-0 top-1/2 transform -translate-y-1/2 bg-background/80 p-2 rounded-l">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </section>
        {% endfor %}
    </main>

    <script>
        // Smooth scroll for hero images with parallax effect
        const mainContent = document.getElementById('main-content');
        const heroes = document.querySelectorAll('.hero-image');
        
        mainContent.addEventListener('scroll', () => {
            heroes.forEach(hero => {
                const section = hero.closest('section');
                const rect = section.getBoundingClientRect();
                const scrollProgress = rect.top / window.innerHeight;
                const translateY = Math.min(100, Math.max(-100, scrollProgress * 50));
                hero.style.transform = `translateY(${translateY}px)`;
            });
        });

        // Highlight active category in navigation
        function updateActiveCategory() {
            const sections = document.querySelectorAll('section');
            const navItems = document.querySelectorAll('#category-nav a');
            
            sections.forEach((section, index) => {
                const rect = section.getBoundingClientRect();
                if (rect.top <= 100 && rect.bottom >= 100) {
                    navItems.forEach(item => item.classList.remove('text-accent'));
                    navItems[index].classList.add('text-accent');
                }
            });
        }

        mainContent.addEventListener('scroll', updateActiveCategory);
        updateActiveCategory(); // Initial call

        // Carousel Navigation
        document.querySelectorAll('.movie-carousel-container').forEach(container => {
            const carousel = container.querySelector('.movie-carousel');
            const prevBtn = container.querySelector('button:first-of-type');
            const nextBtn = container.querySelector('button:last-of-type');
            
            prevBtn.addEventListener('click', () => {
                carousel.scrollBy({ left: -300, behavior: 'smooth' });
            });
            
            nextBtn.addEventListener('click', () => {
                carousel.scrollBy({ left: 300, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
