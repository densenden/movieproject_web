<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MovieWeb{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        :root {
            --background-color: #121212;
            --surface-dark: #1e1e1e;
            --surface-darker: #181818;
            --accent: #E50914;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            background-color: var(--background-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--surface-darker) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            color: var(--accent) !important;
        }

        .navbar-brand img {
            height: 30px;
            margin-right: 10px;
        }

        .nav-link {
            color: var(--text-secondary) !important;
        }

        .nav-link:hover {
            color: var(--accent) !important;
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background-color: #b2070f;
            border-color: #b2070f;
        }

        .btn-outline-light:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .card {
            background-color: var(--surface-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title {
            color: var(--text-primary);
        }

        .card-text {
            color: var(--text-secondary);
        }

        .form-control {
            background-color: var(--surface-darker);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .form-control:focus {
            background-color: var(--surface-darker);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(229, 9, 20, 0.25);
        }

        .form-label {
            color: var(--text-secondary);
        }

        .alert {
            background-color: var(--surface-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .alert-success {
            border-color: var(--accent);
        }

        .alert-danger {
            border-color: #dc3545;
        }

        .badge {
            background-color: var(--accent);
        }

        footer {
            background-color: var(--surface-darker) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .movie-card {
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.02);
        }

        .movie-poster {
            height: 300px;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .movie-poster {
                height: 200px;
            }
        }

        /* Additional styles for index page */
        .bg-surface-dark {
            background-color: var(--surface-dark);
        }

        .text-accent {
            color: var(--accent);
        }

        .text-text-primary {
            color: var(--text-primary);
        }

        .text-text-secondary {
            color: var(--text-secondary);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-background text-text-primary">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="MovieWeb Logo">
                MovieWeb
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('users') }}">Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('add_user') }}">Add User</a>
                    </li>
                </ul>
                <form class="d-flex" action="{{ url_for('search') }}" method="GET">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search movies..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="bg-dark text-light mt-5 py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 MovieWeb. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/movie-cards.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
